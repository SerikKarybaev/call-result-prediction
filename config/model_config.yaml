# Путь к данным
data:
  raw_path: 'data/raw/'
  processed_path: 'data/processed/'

# Параметры разделения данных
train_test_split:
  test_start_date: '2025-02-15'  # Последний месяц — тест

# Признаки для модели
features:
  categorical:
    - region
    - age_group
    - debt_amount_bucket
    - product_type
    - preferred_language
    - segment
    - treename
  
  numerical:
    - risk_score
    - hour
    - is_weekend
    - client_call_number
    - client_prev_result_rate
    - client_prev_contact_rate
    - days_since_last_call

# Целевая переменная
target: is_result

# Параметры моделей
models:
  logistic_regression:
    max_iter: 1000
    random_state: 42
    class_weight: 'balanced'
  
  random_forest:
    n_estimators: 100
    max_depth: 10
    random_state: 42
    n_jobs: -1
    class_weight: 'balanced'
  
  lightgbm:
    n_estimators: 200
    max_depth: 7
    learning_rate: 0.05
    num_leaves: 31
    random_state: 42
    verbose: -1
    is_unbalance: true  # для LightGBM